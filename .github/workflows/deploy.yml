name: Deploy to GitHub Pages

# Builds the Astro site and publishes it via GitHub Pages.
#
# ONE-TIME SETUP (repo owner): go to Settings -> Pages -> Source, and choose
# "GitHub Actions". Without that, this workflow will run but Pages will not
# actually serve the result.
#
# BRANCH NOTE: deploys fire on pushes to `main`, which must also be the
# repository's default branch — `.github/workflows/harvest.yml`'s scheduled
# bot commits land there, and GitHub Actions `schedule` triggers only ever
# fire on the default branch. `workflow_dispatch` ("Run workflow" button)
# remains available for an on-demand deploy from any branch.
#
# BASE_PATH / SITE_URL NOTE (see docs/DECISIONS.md D8 — custom domain and
# GitHub org approved but not yet chosen/created):
#   - No custom domain, no dedicated org (current default): GitHub Pages
#     serves project sites at https://<org>.github.io/<repo-name>/, so the
#     site must be built with base: "/<repo-name>/" (astro.config.mjs reads
#     this from BASE_PATH, set unconditionally below) and a matching site URL
#     for canonical links (astro.config.mjs reads this from SITE_URL, also
#     set below to the current org's github.io host).
#   - Once the dedicated GitHub org (D8) exists and/or a custom domain is
#     registered and a CNAME is configured in Pages settings, both env vars
#     below must change together: BASE_PATH to "/" (or remove the step,
#     since astro.config.mjs already defaults to '/' when unset) and SITE_URL
#     to the real domain. Forgetting this after adding a custom domain will
#     break every internal link, asset path, and canonical URL.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # See the BASE_PATH / SITE_URL note at the top of this file: both
          # change together once the dedicated org / custom domain (D8) lands.
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://minds-medical-intelligence-innovation.github.io
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
